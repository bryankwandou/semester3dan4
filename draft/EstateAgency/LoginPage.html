<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | NNG Property</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .reset-card {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
    }
    .btn-primary {
      background-color: #204ecf;
      border: none;
    }
    .back-link {
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      color: #000;
      text-decoration: none;
      margin-bottom: 1rem;
    }
    .back-link i {
      font-size: 1.2rem;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="reset-card">
      <a href="login.html" class="back-link">
        <i class="bi bi-arrow-left"></i> Reset Password
      </a>
      <hr>
      <p>Silahkan masukan Nomor telepon atau Email yang terdaftar. Kami akan mengirimkan kode verifikasi untuk mengatur ulang Password.</p>
      <div class="mb-3">
        <label for="emailOrPhone" class="form-label">Nomor Telepon atau Email</label>
        <input type="text" class="form-control" id="emailOrPhone" placeholder="Masukan Nomor Telepon atau Email">
      </div>
      <div class="d-grid">
        <button class="btn btn-primary">Selanjutnya</button>
      </div>
    </div>
  </div>

  <!-- Bootstrap Icons (untuk panah) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
